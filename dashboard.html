<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أبحاثي — جَنى</title>
<meta name="description" content="جَنى — منصة ذكية تحوّل أبحاث الدراسات العليا إلى مخرجات تطبيقية تخدم المجتمع.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<main>
  <div class="container">
    <div class="page-head">
      <div>
        <h1 id="hello">أبحاثي</h1>
        <div class="muted small" id="profileLine"></div>
      </div>
      <a class="btn" href="upload.html">＋ رفع بحث جديد</a>
    </div>

    <div id="list"><div class="card empty"><div class="spinner"></div>جارٍ التحميل…</div></div>

    <div class="card" style="margin-top:32px">
      <h3>حسابي</h3>
      <p class="muted small">حذف الحساب يمسح نهائياً بياناتك وكل أبحاثك ومخرجاتها، ولا يمكن التراجع عنه.</p>
      <div id="accMsg" class="hidden"></div>
      <button class="btn danger sm" id="delAcc">حذف حسابي نهائياً</button>
    </div>
  </div>
</main>
<script>
(async () => {
  await renderChrome("dashboard");
  const session = await requireAuth();

  const { data: profile } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (profile) {
    hello.textContent = `أهلاً ${profile.full_name.split(" ")[0]} 👋`;
    profileLine.textContent = [profile.university, profile.specialization].filter(Boolean).join(" · ");
  }

  const { data: items, error } = await sb.from("research")
    .select("id,title,status,verification,created_at,outputs(type)")
    .order("created_at", { ascending: false });

  if (error) { list.innerHTML = `<div class="alert err">تعذّر تحميل الأبحاث: ${esc(error.message)}</div>`; return; }
  if (!items.length) {
    list.innerHTML = `<div class="card empty"><p style="font-size:2rem;margin:0">🌱</p><p>ما رفعت أي بحث بعد.</p><a class="btn" href="upload.html">ارفع بحثك الأول</a></div>`;
    return;
  }
  list.innerHTML = items.map((r) => `
    <div class="card research-item">
      <div>
        <h3><a href="research.html?id=${r.id}">${esc(r.title)}</a></h3>
        <div class="small muted" style="margin-top:4px">
          ${fmtDate(r.created_at)} ·
          <span class="badge ${r.status}">${STATUS[r.status]}</span>
          <span class="badge ${r.verification === "doi_matched" ? "verified" : "declared"}">${r.verification === "doi_matched" ? "موثّق عبر DOI" : "بإقرار الملكية"}</span>
          ${r.outputs.length ? ` · ${r.outputs.map((o) => OUTPUT_TYPES[o.type]?.label).join("، ")}` : ""}
        </div>
      </div>
      <a class="btn ghost sm" href="research.html?id=${r.id}">عرض</a>
    </div>`).join("");
})();

delAcc.addEventListener("click", async () => {
  const typed = prompt("لتأكيد الحذف النهائي لحسابك وكل أبحاثك، اكتب كلمة: حذف");
  if (typed?.trim() !== "حذف") return;
  delAcc.disabled = true;
  const { error } = await sb.functions.invoke("delete-account", { body: {} });
  if (error) { delAcc.disabled = false; return showAlert(accMsg, "err", "تعذّر حذف الحساب، حاول مرة أخرى."); }
  await sb.auth.signOut();
  alert("تم حذف حسابك وكل بياناتك نهائياً.");
  location.href = "index.html";
});
</script>
</body>
</html>
